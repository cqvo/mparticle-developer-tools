<!doctype html>
<meta charset="utf-8">
<title>mParticle Developer Tools</title>
<style>
  :root {
    --bg: #fff;
    --fg: #202124;
    --muted: #5f6368;
    --border: #d8d8d8;
    --code-bg: #f5f5f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --border: #3c4043;
      --code-bg: #292a2d;
    }
  }
  body {
    margin: 0;
    font: 12px system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  #tabs {
    display: flex;
    gap: 8px;
    align-items: center;
    height: 28px;
    box-sizing: border-box;
    padding: 0 8px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
  }
  #tabs button {
    background: none;
    border: 0;
    color: inherit;
    font: inherit;
    cursor: pointer;
    padding: 0 2px;
  }
  #tabs button.active { font-weight: bold; text-decoration: underline; }
  #instance { margin-left: auto; }
  #toolbar, #fwd-toolbar, #id-toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 28px;
    background: var(--bg);
  }
  #filter { flex: 1; min-width: 80px; }
  #count, #fwd-status, #id-status { color: var(--muted); }
  #list, #fwd-list, #id-list { list-style: none; margin: 0; padding: 0; }
  #list li, #fwd-list li, #id-list li {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
  }
  .meta { display: flex; gap: 8px; }
  .meta .url { color: var(--muted); word-break: break-all; }
  .event { margin-left: 12px; }
  pre {
    margin: 4px 0 0;
    padding: 6px;
    background: var(--code-bg);
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  pre, .event, .param { font-family: ui-monospace, Menlo, monospace; }
  .param { color: var(--muted); }
  details { margin-top: 4px; }
  details .param { margin-left: 12px; }
  summary { cursor: pointer; color: var(--muted); }
</style>
<body>
  <div id="tabs">
    <button data-tab="events" class="active">Events</button>
    <button data-tab="forwarders">Forwarders</button>
    <button data-tab="identity">Identity</button>
    <select id="instance"><option>default_instance</option></select>
  </div>
  <section id="events">
    <div id="toolbar">
      <button id="clear">Clear</button>
      <button id="upload">Upload</button>
      <label><input id="preserve" type="checkbox"> Preserve log</label>
      <label><input id="hide-forwarding" type="checkbox" checked> Hide /Forwarding</label>
      <span id="count">0</span>
      <input id="filter" type="text" value="/webevents/">
    </div>
    <ul id="list"></ul>
  </section>
  <section id="forwarders" hidden>
    <div id="fwd-toolbar">
      <button id="refresh">Refresh</button>
      <span id="fwd-status"></span>
    </div>
    <ul id="fwd-list"></ul>
  </section>
  <section id="identity" hidden>
    <div id="id-toolbar">
      <button id="id-refresh">Refresh</button>
      <span id="id-status"></span>
    </div>
    <ul id="id-list"></ul>
  </section>
  <script src="panel.js"></script>
</body>
