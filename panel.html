<!doctype html>
<meta charset="utf-8">
<title>mParticle Events</title>
<style>
  :root {
    --bg: #fff;
    --fg: #202124;
    --muted: #5f6368;
    --border: #d8d8d8;
    --code-bg: #f5f5f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --border: #3c4043;
      --code-bg: #292a2d;
    }
  }
  body {
    margin: 0;
    font: 12px system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  #toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
  }
  #filter { flex: 1; min-width: 80px; }
  #count { color: var(--muted); }
  #list { list-style: none; margin: 0; padding: 0; }
  #list li {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
  }
  .meta { display: flex; gap: 8px; }
  .meta .url { color: var(--muted); word-break: break-all; }
  .event { margin-left: 12px; }
  pre {
    margin: 4px 0 0;
    padding: 6px;
    background: var(--code-bg);
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  pre, .event, .param { font-family: ui-monospace, Menlo, monospace; }
  .param { color: var(--muted); }
  details { margin-top: 4px; }
  summary { cursor: pointer; color: var(--muted); }
</style>
<body>
  <div id="toolbar">
    <button id="clear">Clear</button>
    <span id="count">0</span>
    <input id="filter" type="text" value="/webevents/">
  </div>
  <ul id="list"></ul>
  <script src="panel.js"></script>
</body>
