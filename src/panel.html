<!doctype html>
<meta charset="utf-8">
<title>mParticle Developer Tools</title>
<style>
  :root {
    --bg: #fff;
    --fg: #202124;
    --muted: #5f6368;
    --border: #d8d8d8;
    --code-bg: #f5f5f5;
    --accent: #1a73e8;
    --hover: #f1f3f4;
    --row-alt: #fafafa;
    --ok: #188038;
    --err: #d93025;
    --chip: #e8f0fe;
    accent-color: var(--accent);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --border: #3c4043;
      --code-bg: #292a2d;
      --accent: #8ab4f8;
      --hover: #2b2c2f;
      --row-alt: #242528;
      --ok: #81c995;
      --err: #f28b82;
      --chip: #394457;
    }
  }
  body {
    margin: 0;
    font: 12px system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  #tabs {
    display: flex;
    gap: 8px;
    align-items: center;
    height: 28px;
    box-sizing: border-box;
    padding: 0 8px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
  }
  #tabs button {
    background: none;
    border: 0;
    font: inherit;
    cursor: pointer;
    height: 100%;
    padding: 0 10px;
    color: var(--muted);
  }
  #tabs button:hover { background: var(--hover); }
  #tabs button.active { color: var(--fg); box-shadow: inset 0 -2px var(--accent); }
  #instance {
    margin-left: auto;
    margin-right: 4px;
    font: inherit;
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  #toolbar, #fwd-toolbar, #id-toolbar {
    display: flex;
    gap: 6px;
    align-items: center;
    height: 30px;
    box-sizing: border-box;
    padding: 0 8px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 28px;
    background: var(--bg);
  }
  #toolbar button, #fwd-toolbar button, #id-toolbar button {
    font: inherit;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  #toolbar button:hover, #fwd-toolbar button:hover, #id-toolbar button:hover { background: var(--hover); }
  #toolbar button svg, #fwd-toolbar button svg, #id-toolbar button svg { width: 14px; height: 14px; display: block; }
  #clear, #collapse, #upload, #refresh, #id-refresh { padding: 2px 5px; }
  #clear, #collapse, #upload, #refresh, #id-refresh { position: relative; }
  #clear::after, #collapse::after, #upload::after, #refresh::after, #id-refresh::after {
    content: attr(aria-label);
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    padding: 2px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--fg);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity .1s .2s;
    z-index: 1;
  }
  #clear:hover::after, #collapse:hover::after, #upload:hover::after, #refresh:hover::after, #id-refresh:hover::after { opacity: 1; }
  #settings-form { padding: 12px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; max-width: 420px; }
  #settings-form label { display: grid; grid-template-columns: 110px 1fr; align-items: center; }
  #settings-form label:has(input[type=checkbox]) { display: flex; gap: 6px; }
  #count { padding: 0 6px; border-radius: 8px; background: var(--code-bg); margin-left: auto; }
  #count, #fwd-status, #id-status { color: var(--muted); }
  #list, #fwd-list, #id-list { list-style: none; margin: 0; padding: 0; }
  #list li, #fwd-list li, #id-list li {
    padding: 4px 8px;
    border-bottom: 1px solid var(--border);
  }
  #list li:nth-child(even), #fwd-list li:nth-child(even), #id-list li:nth-child(even) { background: var(--row-alt); }
  #list li:hover, #fwd-list li:hover, #id-list li:hover { background: var(--hover); }
  #list:empty::after {
    content: 'Waiting for mParticle requests…';
    display: block;
    padding: 24px;
    text-align: center;
    color: var(--muted);
  }
  .meta {
    display: flex;
    gap: 10px;
    align-items: baseline;
    font-family: ui-monospace, Menlo, monospace;
  }
  .time { color: var(--muted); min-width: 56px; }
  .method { font-weight: 600; min-width: 34px; }
  .status { min-width: 24px; }
  .ok { color: var(--ok); }
  .err { color: var(--err); }
  .muted { color: var(--muted); }
  .url { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .event { display: flex; gap: 6px; align-items: baseline; }
  .type {
    font-size: 10px;
    padding: 0 5px;
    border-radius: 3px;
    background: var(--chip);
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: .02em;
  }
  .name { font-weight: 600; }
  .attrs-count { color: var(--muted); }
  .kv {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 1px 12px;
    margin: 4px 0 2px 14px;
    font-family: ui-monospace, Menlo, monospace;
  }
  .kv .k { color: var(--muted); }
  .kv .v { word-break: break-all; }
  pre {
    margin: 4px 0 0;
    padding: 6px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 11px;
    line-height: 1.4;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  pre, .event, .param { font-family: ui-monospace, Menlo, monospace; }
  .param { color: var(--muted); }
  details { margin-top: 4px; }
  #list details { margin: 2px 0 0 66px; }
  #list details.section > summary { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
  #list details.section { margin-top: 6px; }
  #list details.section > details { margin-left: 14px; }
  #fwd-list details, #id-list details { margin: 4px 0 0 0; }
  summary { cursor: pointer; font-size: 11px; color: var(--muted); user-select: none; }
  summary:hover { color: var(--fg); }
</style>
<body>
  <div id="tabs">
    <button data-tab="events" class="active">Events</button>
    <button data-tab="forwarders">Forwarders</button>
    <button data-tab="identity">Identity</button>
    <button data-tab="settings">Settings</button>
    <select id="instance"><option>default_instance</option></select>
  </div>
  <section id="events">
    <div id="toolbar">
      <button id="clear" aria-label="Clear"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
      <button id="collapse" aria-label="Collapse All"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h8"/><path d="M3 12h8"/><path d="M3 19h8"/><path d="m15 5 3 3 3-3"/><path d="m15 19 3-3 3 3"/></svg></button>
      <button id="upload" aria-label="Force Batch Upload"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13v8"/><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="m8 17 4-4 4 4"/></svg></button>
      <label><input id="preserve" type="checkbox"> Preserve log</label>
      <span id="count">0</span>
    </div>
    <ul id="list"></ul>
  </section>
  <section id="forwarders" hidden>
    <div id="fwd-toolbar">
      <button id="refresh" aria-label="Refresh"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
      <span id="fwd-status"></span>
    </div>
    <ul id="fwd-list"></ul>
  </section>
  <section id="identity" hidden>
    <div id="id-toolbar">
      <button id="id-refresh" aria-label="Refresh"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
      <span id="id-status"></span>
    </div>
    <ul id="id-list"></ul>
  </section>
  <section id="settings" hidden>
    <div id="settings-form">
      <label><input id="hide-forwarding" type="checkbox" checked> Hide /Forwarding</label>
    </div>
  </section>
  <script src="panel.js"></script>
</body>
