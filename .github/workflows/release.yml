name: release
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  ci:
    uses: ./.github/workflows/test.yml
  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: npx --yes -p semantic-release@25 -p @semantic-release/exec@7 semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}
