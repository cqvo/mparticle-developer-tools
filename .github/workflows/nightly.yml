name: nightly
on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC = midnight PT
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip if HEAD is already released
        id: check
        run: |
          if [ -n "$(git tag --points-at HEAD)" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          v="v$(jq -r .version src/manifest.json)-nightly.$(date -u +%Y%m%d)"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.skip != 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - if: steps.check.outputs.skip != 'true'
        run: |
          deno task build
          jq --arg v "${{ steps.check.outputs.tag }}" '.version_name=$v' dist/manifest.json > m && mv m dist/manifest.json
          (cd dist && zip -r ../mparticle-developer-tools.zip .)
      - if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: gh release create "$TAG" mparticle-developer-tools.zip --prerelease --generate-notes --title "Nightly $(date -u +%Y-%m-%d)"
      - name: Prune nightlies older than the newest 7
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt --jq '[.[] | select(.tagName | contains("-nightly."))] | sort_by(.createdAt) | reverse | .[7:] | .[].tagName' \
            | xargs -r -n1 gh release delete -y --cleanup-tag
