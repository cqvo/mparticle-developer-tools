name: nightly
on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC = midnight PT
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ci:
    uses: ./.github/workflows/test.yml
  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip if HEAD is already released
        id: check
        run: |
          if [ -n "$(git tag --points-at HEAD)" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          last=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          IFS=. read -r maj min pat <<< "${last#v}"
          v="${maj:-0}.${min:-0}.$(( ${pat:-0} + 1 ))-nightly.$(date -u +%Y%m%d)"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"; echo "version=$v" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.skip != 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - if: steps.check.outputs.skip != 'true'
        run: scripts/package.sh "${{ steps.check.outputs.version }}"
      - if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: gh release create "$TAG" mparticle-developer-tools.zip --prerelease --generate-notes --title "Nightly $(date -u +%Y-%m-%d)"
      - name: Prune nightlies older than the newest 7
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt --jq '[.[] | select(.tagName | contains("-nightly."))] | sort_by(.createdAt) | reverse | .[7:] | .[].tagName' \
            | xargs -r -n1 gh release delete -y --cleanup-tag
