name: workflows
on:
  pull_request:
    paths: ['.github/workflows/**', '.actrc']
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.actrc']
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
  act:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -sSfL https://raw.githubusercontent.com/nektos/act/master/install.sh | sudo bash -s -- -b /usr/local/bin v0.2.89
      - run: |
          for f in .github/workflows/*.yml; do
            [ "$f" = .github/workflows/workflows.yml ] && continue
            act pull_request -W "$f"
          done
